# 推送 v 开头的标签（如 v0.1.0）时，自动编译通用版并发布到 Releases
name: Release

on:
  push:
    branches: [main]   # 每次推送都编译一次，提前发现问题（不发布）
    tags: ["v*"]       # 打 v 标签时编译并发布
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info.plist

      - name: Build universal app
        run: |
          echo "::notice::$(swiftc --version 2>&1 | head -1)"
          set -o pipefail
          if ! ./build.sh universal 2>&1 | tee build.log; then
            # 把编译错误写成 annotation，不登录也能在网页/API 上看到
            grep -E "error:" build.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Zip
        run: ditto -c -k --keepParent build/FloatPlan.app FloatPlan.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FloatPlan
          path: FloatPlan.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FloatPlan.zip
          generate_release_notes: true
