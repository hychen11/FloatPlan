# 推送 v 开头的标签（如 v0.1.0）时，自动编译通用版并发布到 Releases
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info.plist

      - name: Build universal app
        run: ./build.sh universal

      - name: Zip
        run: ditto -c -k --keepParent build/FloatPlan.app FloatPlan.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FloatPlan
          path: FloatPlan.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FloatPlan.zip
          generate_release_notes: true
